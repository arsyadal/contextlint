[package]
name = "contextlint"
version = "0.1.3"
edition = "2021"
description = "Lint, score, and compress AI agent context files"
license = "MIT"
repository = "https://github.com/arsyadal/contextlint"
readme = "README.md"
keywords = ["cli", "lint", "ai", "context", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
globset = "0.4"
model-context-protocol = { version = "0.2.2", features = ["full"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
walkdir = "2"

[package]
name = "contextlint"
version = "0.1.0"
edition = "2021"
description = "Lint, score, and compress AI agent context files"
license = "MIT"
repository = "https://github.com/arsyadal/contextlint"
readme = "README.md"
keywords = ["cli", "lint", "ai", "context", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
